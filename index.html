<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor Operativo BAM · Grupo Synergo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #070b14;
      --bg-gradient: radial-gradient(circle at 12% 0%, rgba(37, 99, 235, 0.16), transparent 42%),
                     radial-gradient(circle at 88% 8%, rgba(16, 185, 129, 0.11), transparent 38%),
                     #070b14;
      --surface: rgba(15, 23, 42, 0.86);
      --surface-elevated: #131d33;
      --surface-input: #0c1322;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;

      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --accent-ring: rgba(59, 130, 246, 0.35);

      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.15);
      --success-text: #6ee7b7;

      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.15);
      --warning-text: #fcd34d;

      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --danger-text: #fca5a5;

      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      padding: 20px 14px 48px;
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      box-shadow: var(--shadow-card);
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #10b981 100%);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #ffffff;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success-text);
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-top: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .segmented-nav {
      display: inline-flex;
      background: var(--surface-input);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: var(--radius-md);
      gap: 4px;
    }

    .nav-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 9px 16px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (max-width: 700px) {
      .kpi-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-card);
    }

    .kpi-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .kpi-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .kpi-tag {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #93c5fd;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-card);
      margin-bottom: 18px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-badge {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      font-size: 0.8rem;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .field {
      margin-bottom: 15px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      background: var(--surface-input);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      font-family: inherit;
      font-size: 0.94rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .field-note {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .autocomplete-menu {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      background: #0b1220;
      border: 1px solid var(--accent);
      border-radius: var(--radius-md);
      max-height: 260px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.65);
      display: none;
    }

    .autocomplete-option {
      padding: 11px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      font-size: 0.88rem;
      transition: background 0.12s ease;
    }

    .autocomplete-option:last-child {
      border-bottom: none;
    }

    .autocomplete-option:hover,
    .autocomplete-option.active {
      background: var(--accent-soft);
    }

    .code-mono {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.84rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .chip-es {
      background: var(--accent-soft);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .chip-gc {
      background: var(--success-soft);
      color: var(--success-text);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .chip-other {
      background: var(--warning-soft);
      color: var(--warning-text);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .toggle-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      padding: 13px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .toggle-card:hover {
      border-color: rgba(59, 130, 246, 0.45);
    }

    .toggle-card input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .relation-banner {
      background: rgba(59, 130, 246, 0.09);
      border: 1px solid rgba(59, 130, 246, 0.32);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 15px;
      font-size: 0.86rem;
    }

    .relation-banner.muted-state {
      background: var(--surface-elevated);
      border-color: var(--border);
      opacity: 0.85;
    }

  .preview-box {
      background: #080d18;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      user-select: all;
      word-break: break-word;
    }

    .preview-subject {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.86rem;
      font-weight: 600;
      color: #f1f5f9;
    }
